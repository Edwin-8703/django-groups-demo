{% extends 'accounts/base.html' %}
{% load static %}
{% block content %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: 'Roboto', sans-serif;
  }

  body {
    background: #27aae1;
    min-height: 100vh;
  }

  .login-wrapper {
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .login-card {
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
    padding: 36px 32px 28px 32px;
    max-width: 360px;
    width: 100%;
  }

  /* Logos */
  .login-logos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 18px;
  }

  .login-logos img {
    height: 52px;
    object-fit: contain;
  }

  .logo-divider {
    width: 1px;
    height: 44px;
    background: #dde3ea;
    flex-shrink: 0;
  }

  .cema-logo-text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.15;
  }

  .cema-main {
    font-size: 28px;
    font-weight: 700;
    color: #1a73c8;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .africa-icon {
    color: #e67e22;
    font-size: 22px;
    margin-left: 1px;
  }

  .cema-sub {
    font-size: 9px;
    color: #4a6080;
    font-weight: 400;
    line-height: 1.3;
    max-width: 110px;
  }

  .uon-logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .uon-img {
    height: 52px;
    width: auto;
    object-fit: contain;
  }

  .uon-label {
    font-size: 7.5px;
    font-weight: 700;
    color: #2c3e50;
    letter-spacing: 0.5px;
    text-align: center;
  }

  /* Title */
  .login-title {
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    color: #50bae7;
    letter-spacing: 2px;
    margin: 0 0 6px 0;
    text-transform: uppercase;
  }

  .login-subtitle {
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: #1a1a2e;
    margin: 0 0 22px 0;
  }

  /* Error */
  .error-msg {
    background: #fff0f0;
    border: 1px solid #ffcccc;
    color: #cc0000;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    margin-bottom: 14px;
    text-align: center;
  }
  .logo-container {
  text-align: center;
  margin-bottom: 24px; /* pushes LOGIN down */
}

.logo-container img {
  max-width: 75%;
  height: auto;
}

/* Improve spacing for title block */
.login-title {
  margin-top: 8px;
  margin-bottom: 8px;
}

.login-subtitle {
  margin-bottom: 24px;
}

  /* Inputs */
  .input-group {
    position: relative;
    margin-bottom: 16px;
  }

  .input-group input {
    width: 100%;
    border: 1.5px solid #b0bec5;
    border-radius: 10px;
    padding: 13px 44px 13px 16px;
    font-size: 15px;
    color: #222;
    background: #fff;
    outline: none;
    transition: border-color 0.2s;
    font-family: 'Roboto', sans-serif;
  }

  .input-group input::placeholder {
    color: #8a9bb0;
    font-weight: 400;
  }

  .input-group input:focus {
    border-color: #1a73c8;
  }

  .input-icon {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #8a9bb0;
    pointer-events: none;
    display: flex;
    align-items: center;
  }

  .toggle-password {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #8a9bb0;
    cursor: pointer;
    display: flex;
    align-items: center;
    background: none;
    border: none;
    padding: 0;
  }

  /* Remember me */
  .remember-row {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 20px;
  }

  .remember-row input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: #1a73c8;
    flex-shrink: 0;
  }

  .remember-row label {
    font-size: 14px;
    color: #333;
    cursor: pointer;
    font-weight: 400;
  }

  /* Login button */
  .login-btn {
    width: 100%;
    background: linear-gradient(135deg, #a8d8f0 0%, #c5e8fa 60%, #b0d8f5 100%);
    color: #1a4a80;
    border: none;
    padding: 13px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: 'Roboto', sans-serif;
    letter-spacing: 0.5px;
    transition: background 0.2s, box-shadow 0.2s;
    box-shadow: 0 2px 10px rgba(26,115,200,0.13);
  }

  .login-btn:hover {
    background: linear-gradient(135deg, #89c8e8 0%, #aad8f8 60%, #92c8ee 100%);
    box-shadow: 0 4px 16px rgba(26,115,200,0.25);
  }

  .login-btn-icon {
    background: #1a73c8;
    color: #fff;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* Forgot link */
  .forgot-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: #1a73c8;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
  }

  .forgot-link:hover {
    text-decoration: underline;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .login-card {
      padding: 28px 18px 22px 18px;
      border-radius: 14px;
    }
    .login-title { font-size: 22px; }
    .cema-main { font-size: 24px; }
    .login-btn { font-size: 15px; padding: 12px; }
  }

  @media (max-width: 360px) {
    .login-card { padding: 22px 14px 18px 14px; }
    .cema-main { font-size: 20px; }
    .cema-sub { font-size: 8px; max-width: 90px; }
  }
</style>

<div class="login-wrapper">
  <div class="login-card">

    <!-- Logos -->
   <div class="logo-container">
  <img 
    src="https://cema-africa.uonbi.ac.ke/_next/image?url=%2Fimages%2Flogo.jpg&w=384&q=75" 
    alt="CEMA Logo"
  >
</div>

    <!-- Title -->
    <h2 class="login-title">LOGIN</h2>
    <p class="login-subtitle">Welcome to CEMA Hub</p>

    {% if form.errors %}
      <div class="error-msg">Wrong username or password.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <!-- Email field -->
      <div class="input-group">
        <input
          name="username"
          type="email"
          placeholder="Email address"
          autofocus
          autocomplete="username"
        />
        <span class="input-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="M2 7l10 7 10-7"/>
          </svg>
        </span>
      </div>

      <!-- Password field -->
      <div class="input-group">
        <input
          id="passwordInput"
          name="password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        />
        <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Toggle password visibility">
          <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>

      <!-- Remember me -->
      <div class="remember-row">
        <input type="checkbox" id="rememberMe" name="remember_me">
        <label for="rememberMe">Remember me</label>
      </div>

      <!-- Login button -->
      <button type="submit" class="login-btn">
        <span class="login-btn-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
        </span>
        Login
      </button>
    </form>

    <a href="#" class="forgot-link">Forgot password</a>

  </div>
</div>

<script>
  function togglePassword() {
    const input = document.getElementById('passwordInput');
    const icon = document.getElementById('eyeIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.innerHTML = `
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      `;
    } else {
      input.type = 'password';
      icon.innerHTML = `
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      `;
    }
  }
</script>
{% endblock %}
