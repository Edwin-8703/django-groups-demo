<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Requests</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { font-family: 'Segoe UI', sans-serif; background: #f3f4f6; min-height: 100vh; padding: 2.5rem; }

    .outer { max-width: 1000px; margin: 0 auto; }

    .back-btn { display: inline-flex; align-items: center; border: 1.5px solid #e5e7eb; color: #6b7280; background: #fff; padding: 0.4rem 1rem; border-radius: 6px; font-weight: 600; text-decoration: none; margin-bottom: 1.5rem; font-size: 0.85rem; transition: background 0.15s; cursor: pointer; }
    .back-btn:hover { background: #f3f4f6; color: #111827; }

    .table-wrap { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 1.5rem; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 0.8rem; }
    .entries-wrap { display: flex; align-items: center; gap: 0.6rem; font-size: 0.9rem; color: #374151; }
    .entries-wrap select { padding: 0.35rem 0.6rem; border: 2px solid #3b82f6; border-radius: 6px; font-size: 0.85rem; color: #374151; cursor: pointer; outline: none; }
    .search-wrap { display: flex; align-items: center; gap: 0.6rem; font-size: 0.9rem; color: #374151; }
    .search-wrap input { padding: 0.35rem 0.75rem; border: 2px solid #111827; border-radius: 6px; font-size: 0.85rem; outline: none; transition: border 0.15s; }
    .search-wrap input:focus { border-color: #3b82f6; }

    /* ── DESKTOP TABLE ── */
    .doc-table { width: 100%; border-collapse: collapse; }
    .doc-table th, .doc-table td { padding: 0.85rem 1rem; text-align: left; font-size: 0.88rem; border-bottom: 1px solid #e5e7eb; color: #374151; }
    .doc-table th { font-weight: 600; color: #6b7280; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 2px solid #e5e7eb; }
    .doc-table tbody tr:hover { background: #f9fafb; }
    .doc-table tbody tr:last-child td { border-bottom: none; }

    .status-pending { display: inline-block; background: #fef9c3; color: #854d0e; border: 1px solid #fde68a; border-radius: 999px; padding: 0.2rem 0.7rem; font-size: 0.75rem; font-weight: 600; }

    .btn-view { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.3rem 0.75rem; border-radius: 6px; font-size: 0.8rem; font-weight: 500; border: 1.5px solid #d97706; color: #d97706; background: #fffbeb; cursor: pointer; font-family: inherit; transition: opacity 0.15s; white-space: nowrap; }
    .btn-view:hover { opacity: 0.8; }

    /* Mobile label */
    .mob-label { display: none; }

    .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 1.2rem; font-size: 0.85rem; color: #6b7280; flex-wrap: wrap; gap: 0.8rem; }
    .pagination { display: flex; gap: 0.25rem; flex-wrap: wrap; }
    .pagination a { padding: 0.25rem 0.55rem; border: 1px solid #e5e7eb; border-radius: 4px; text-decoration: none; color: #374151; font-size: 0.8rem; transition: background 0.15s; }
    .pagination a:hover { background: #f3f4f6; }
    .pagination a.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }

    /* ── MODAL ── */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 12px; padding: 2rem; width: 100%; max-width: 520px; box-shadow: 0 8px 40px rgba(0,0,0,0.15); animation: slideUp 0.2s ease; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .modal-title { font-size: 1rem; font-weight: 700; color: #111827; margin-bottom: 1.2rem; text-align: center; }
    .modal-details { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1.2rem; margin-bottom: 1.5rem; }
    .detail-row { display: flex; justify-content: space-between; padding: 0.4rem 0; font-size: 0.87rem; border-bottom: 1px solid #e5e7eb; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: #6b7280; font-weight: 500; }
    .detail-value { color: #111827; font-weight: 600; }

    .modal-actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    .btn-modal { padding: 0.5rem 1.3rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: 1.5px solid; font-family: inherit; transition: opacity 0.15s; }
    .btn-modal:hover { opacity: 0.8; }
    .btn-approve  { background: #f0fdf4; color: #16a34a; border-color: #16a34a; }
    .btn-moreinfo { background: #eff6ff; color: #3b82f6; border-color: #3b82f6; }
    .btn-reject   { background: #fef2f2; color: #dc2626; border-color: #dc2626; }

    .modal-close { display: block; margin: 1rem auto 0; background: none; border: none; color: #9ca3af; font-size: 0.8rem; cursor: pointer; font-family: inherit; }
    .modal-close:hover { color: #374151; }

    /* ── MOBILE CARD LAYOUT ── */
    @media (max-width: 640px) {
      body { padding: 1rem; }
      .table-wrap { padding: 1rem; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .search-wrap { width: 100%; }
      .search-wrap input { flex: 1; width: 100%; }

      .doc-table thead { display: none; }
      .doc-table, .doc-table tbody { display: block; }

      .doc-table tbody tr {
        display: block;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        margin-bottom: 0.9rem;
        padding: 1rem;
        box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      }
      .doc-table tbody tr:last-child { margin-bottom: 0; }
      .doc-table tbody tr:hover { background: #f9fafb; }

      .doc-table td {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.3rem 0;
        border-bottom: none;
        font-size: 0.88rem;
      }

      .mob-label {
        display: inline-block;
        font-size: 0.72rem;
        font-weight: 700;
        color: #9ca3af;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        min-width: 80px;
        padding-top: 2px;
        flex-shrink: 0;
      }

      /* Action cell */
      .td-action {
        margin-top: 0.6rem;
        padding-top: 0.7rem !important;
        border-top: 1px solid #f3f4f6 !important;
      }
      .td-action .btn-view { flex: 1; justify-content: center; }

      .modal { padding: 1.4rem; }
      .modal-actions { gap: 0.5rem; }
      .btn-modal { flex: 1; text-align: center; padding: 0.5rem 0.6rem; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

  <div class="outer">
    <a href="javascript:history.back()" class="back-btn">← Back</a>

    <div class="table-wrap">
      <div class="toolbar">
        <div class="entries-wrap">
          <select><option>10</option><option>25</option><option>50</option><option>100</option></select>
          Entries per page
        </div>
        <div class="search-wrap">
          Search <input type="text" placeholder="">
        </div>
      </div>

      <table class="doc-table">
        <thead>
          <tr>
            <th>Request ID</th>
            <th>Type</th>
            <th>Applicant</th>
            <th>Date</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><span class="mob-label">Request ID</span>SR-001</td>
            <td><span class="mob-label">Type</span>Paternity leave</td>
            <td><span class="mob-label">Applicant</span>Edwin</td>
            <td><span class="mob-label">Date</span>2026-02-27</td>
            <td><span class="mob-label">Status</span><span class="status-pending">Pending</span></td>
            <td class="td-action">
              <button class="btn-view" onclick="openModal('SR-001','Paternity leave','Edwin','2026-02-27','Pending')">👁 View</button>
            </td>
          </tr>
          <tr><td></td><td></td><td></td><td></td><td></td><td></td></tr>
          <tr><td></td><td></td><td></td><td></td><td></td><td></td></tr>
        </tbody>
      </table>

      <div class="footer">
        <span>Showing 1 to 10 of 50 entries</span>
        <div class="pagination">
          <a href="#">&lt;&lt;</a>
          <a href="#">&lt;</a>
          <a href="#" class="active">1</a>
          <a href="#">2</a>
          <a href="#">3</a>
          <a href="#">4</a>
          <a href="#">&gt;&gt;</a>
          <a href="#">&gt;</a>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-title">Request Details</div>
      <div class="modal-details">
        <div class="detail-row"><span class="detail-label">Request ID</span><span class="detail-value" id="m-id"></span></div>
        <div class="detail-row"><span class="detail-label">Type</span><span class="detail-value" id="m-type"></span></div>
        <div class="detail-row"><span class="detail-label">Applicant</span><span class="detail-value" id="m-applicant"></span></div>
        <div class="detail-row"><span class="detail-label">Date</span><span class="detail-value" id="m-date"></span></div>
        <div class="detail-row"><span class="detail-label">Status</span><span class="detail-value" id="m-status"></span></div>
      </div>
      <div class="modal-actions">
        <button class="btn-modal btn-approve">Approve</button>
        <button class="btn-modal btn-moreinfo">More Info</button>
        <button class="btn-modal btn-reject">Reject</button>
      </div>
      <button class="modal-close" onclick="closeModal()">✕ Close</button>
    </div>
  </div>

  <script>
    function openModal(id, type, applicant, date, status) {
      document.getElementById('m-id').textContent        = id;
      document.getElementById('m-type').textContent      = type;
      document.getElementById('m-applicant').textContent = applicant;
      document.getElementById('m-date').textContent      = date;
      document.getElementById('m-status').textContent    = status;
      document.getElementById('modalOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      document.body.style.overflow = '';
    }
    document.getElementById('modalOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  </script>

</body>
</html>
