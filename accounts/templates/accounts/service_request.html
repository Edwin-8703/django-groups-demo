<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Request</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f3f4f6; min-height: 100vh; padding: 2rem; }

    .back-btn {
      display: inline-flex; align-items: center;
      border: 1.5px solid #e5e7eb; color: #6b7280; background: #fff;
      padding: 0.4rem 1rem; border-radius: 6px; font-weight: 600;
      text-decoration: none; margin-bottom: 1.2rem; cursor: pointer;
      font-size: 0.85rem; transition: background 0.15s;
    }
    .back-btn:hover { background: #f3f4f6; color: #111827; }

    .page-wrap { display: flex; gap: 1.5rem; max-width: 1000px; margin: 0 auto; align-items: flex-start; }

    .left-panel {
      flex: 1; background: #fff; border: 1px solid #e5e7eb;
      border-radius: 10px; padding: 1.5rem;
    }

    .welcome-box {
      background: #d1fae5; border: 2px solid #6ee7b7;
      border-radius: 8px; padding: 1rem 1.2rem;
      font-size: 1.2rem; font-weight: 700; color: #065f46;
      margin-bottom: 1rem;
    }

    .btn-row { display: flex; gap: 0.6rem; margin-bottom: 1.5rem; margin-top: 0.8rem; }

    .btn-action {
      padding: 0.45rem 1rem; border-radius: 6px; font-size: 0.85rem;
      font-weight: 600; cursor: pointer; border: 1.5px solid;
      text-decoration: none; transition: opacity 0.15s; background: #fff;
    }
    .btn-action:hover { opacity: 0.8; }
    .btn-green { color: #16a34a; border-color: #16a34a; }
    .btn-red   { color: #dc2626; border-color: #dc2626; }

    .mini-table { width: 100%; border-collapse: collapse; }
    .mini-table th, .mini-table td {
      padding: 0.6rem 0.8rem; font-size: 0.82rem; color: #9ca3af;
      border-bottom: 1px solid #e5e7eb; text-align: left;
    }
    .mini-table th { color: #6b7280; font-weight: 600; }

    .form-panel {
      flex: 1.2; background: #fff; border: 1px solid #e5e7eb;
      border-radius: 10px; padding: 1.5rem; display: none;
    }
    .form-panel.open { display: block; }

    .form-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.4rem; }
    .form-title { font-weight: 700; font-size: 1rem; color: #111827; }
    .form-note { color: #dc2626; font-size: 0.75rem; margin-bottom: 1.2rem; }

    .form-row { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .form-group { display: flex; flex-direction: column; gap: 0.3rem; flex: 1; min-width: 120px; }
    .form-group label { font-size: 0.8rem; font-weight: 600; color: #374151; }

    select, input[type="date"], input[type="text"], textarea {
      padding: 0.45rem 0.7rem; border: 1.5px solid #d1d5db;
      border-radius: 6px; font-size: 0.85rem; color: #374151;
      outline: none; transition: border 0.15s; font-family: inherit;
    }
    select:focus, input:focus, textarea:focus { border-color: #3b82f6; }
    textarea { resize: vertical; min-height: 90px; }

    .bottom-row { display: flex; gap: 1rem; margin-bottom: 1rem; }

    .btn-file {
      padding: 0.45rem 1rem; border-radius: 6px; font-size: 0.85rem;
      font-weight: 600; cursor: pointer; border: 1.5px solid #d97706;
      color: #d97706; background: #fffbeb; transition: opacity 0.15s;
    }
    .btn-file:hover { opacity: 0.8; }

    .drop-zone {
      border: 2px dashed #d1d5db;
      border-radius: 8px;
      padding: 1.2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: #f9fafb;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
    }
    .drop-zone.dragover { border-color: #3b82f6; background: #eff6ff; }
    .drop-icon { font-size: 1.8rem; }
    .drop-text { font-size: 0.85rem; color: #374151; font-weight: 500; }
    .drop-sub { font-size: 0.78rem; color: #9ca3af; }
    .drop-browse { color: #3b82f6; cursor: pointer; text-decoration: underline; }
    .file-list { width: 100%; margin-top: 0.5rem; }
    .file-item {
      display: flex; justify-content: space-between; align-items: center;
      background: #fff; border: 1px solid #e5e7eb; border-radius: 6px;
      padding: 0.3rem 0.6rem; font-size: 0.78rem; color: #374151;
      margin-top: 0.3rem;
    }
    .file-remove { color: #dc2626; cursor: pointer; font-weight: 700; margin-left: 0.5rem; }

    .btn-submit {
      background: #16a34a; color: #fff; border: none;
      padding: 0.55rem 1.8rem; border-radius: 6px; font-size: 0.9rem;
      font-weight: 600; cursor: pointer; margin-top: 0.5rem;
      transition: background 0.15s;
    }
    .btn-submit:hover { background: #15803d; }
  </style>
</head>
<body>

  <div style="max-width:1000px; margin: 0 auto;">
    <a href="javascript:history.back()" class="back-btn">← Back</a>
  </div>

  <div class="page-wrap">
    <!-- Left panel -->
    <div class="left-panel">
      <div class="welcome-box">Welcome Edwin</div>
      <p style="font-size:0.9rem; color:#374151; margin-bottom:0.3rem;">File a Service Request</p>
      <div class="btn-row">
        <button class="btn-action btn-green" onclick="document.getElementById('serviceForm').classList.add('open')">File request</button>
        <a href="javascript:history.back()" class="btn-action btn-red">Back</a>
      </div>
      <table class="mini-table">
        <thead>
          <tr><th>Service type</th><th>Reason</th><th>Status</th></tr>
        </thead>
        <tbody>
          <tr><td>&nbsp;</td><td></td><td></td></tr>
          <tr><td>&nbsp;</td><td></td><td></td></tr>
        </tbody>
      </table>
    </div>

    <!-- Form panel -->
    <div class="form-panel" id="serviceForm">
      <div class="form-header">
        <div>
          <div class="form-title">Service Request</div>
          <div class="form-note">1. Note that once you submit your request, you will not be able to edit or revoke it</div>
        </div>
        <button class="btn-action btn-red" onclick="document.getElementById('serviceForm').classList.remove('open')">Back</button>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Service type</label>
          <select>
            <option value="">............</option>
            <option>IT Support</option>
            <option>Maintenance</option>
            <option>HR Request</option>
          </select>
        </div>
        <div class="form-group">
          <label>Submission date</label>
          <input type="date">
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select>
            <option value="">............</option>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
          </select>
        </div>
      </div>

      <div class="bottom-row">
        <div class="form-group">
          <label><strong>Reason for service request</strong></label>
          <textarea placeholder="Reason for filing a service request"></textarea>
        </div>
        <div class="form-group">
          <label><strong>Attachment (Optional)</strong></label>
          <div class="drop-zone" id="dropZone">
            <input type="file" id="fileInput" style="display:none;" multiple>
            <div class="drop-icon">📁</div>
            <p class="drop-text">Drag & drop file here</p>
            <p class="drop-sub">or <span class="drop-browse" onclick="document.getElementById('fileInput').click()">browse</span></p>
            <div id="fileList" class="file-list"></div>
          </div>
        </div>
      </div>

      <button class="btn-submit">Submit</button>
    </div>
  </div>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const fileList = document.getElementById('fileList');
  let files = [];

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    addFiles(e.dataTransfer.files);
  });

  fileInput.addEventListener('change', () => addFiles(fileInput.files));

  function addFiles(newFiles) {
    for (let f of newFiles) files.push(f);
    renderFiles();
  }

  function removeFile(index) {
    files.splice(index, 1);
    renderFiles();
  }

  function renderFiles() {
    fileList.innerHTML = '';
    files.forEach((f, i) => {
      const item = document.createElement('div');
      item.className = 'file-item';
      item.innerHTML = `<span>📄 ${f.name}</span><span class="file-remove" onclick="removeFile(${i})">✕</span>`;
      fileList.appendChild(item);
    });
  }
</script>
</body>
</html>
